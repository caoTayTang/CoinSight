name: coinsight-warehouse-agents
x-common: &common
  image: coinsight-warehouse-agents:1.0.0
  build:
    context: ..
    dockerfile: warehouse_agents/Dockerfile
  networks: [default, observability]
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: ['/tmp:size=32m,noexec,nosuid']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 2
  mem_limit: 768m
  pids_limit: 128
  volumes:
    - ../data/models/warehouse-anomaly/v1:/models/anomaly:ro
    - ./router.json:/config/router.json:ro
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 15s
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: '3'}
x-env: &env
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
  OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
  LLM_ROUTER_CONFIG: /config/router.json
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  WAREHOUSE_AGENT_TOKEN: ${WAREHOUSE_AGENT_TOKEN:-}
  ANOMALY_MODEL_DIR: /models/anomaly
  PYTHONDONTWRITEBYTECODE: '1'
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  AWS_EC2_METADATA_DISABLED: 'true'
  FORECAST_AGENT_URL: http://host.docker.internal:8011
  OPERATIONS_AGENT_URL: http://operations:8000
  ANALYST_AGENT_URL: http://analyst:8000
  WAREHOUSE_DATABASE_URL: ${WAREHOUSE_AGENT_DATABASE_URL:-postgresql://crypto:crypto@host.docker.internal:5432/crypto_dw}
  AIRFLOW_API_URL: ${WAREHOUSE_AGENT_AIRFLOW_URL:-http://host.docker.internal:8081}
  AIRFLOW_API_TOKEN: ${AIRFLOW_API_TOKEN:-}
  WAREHOUSE_API_URL: http://host.docker.internal:8000
  JAEGER_URL: http://host.docker.internal:16686
services:
  analyst:
    <<: *common
    environment:
      <<: *env
      OTEL_SERVICE_NAME: coinsight-trade
      WAREHOUSE_AGENT_ROLE: analyst
      AGENT_PUBLIC_URL: http://127.0.0.1:8021
    ports: [127.0.0.1:8021:8000]
  operations:
    <<: *common
    environment:
      <<: *env
      OTEL_SERVICE_NAME: coinsight-sre
      WAREHOUSE_AGENT_ROLE: operations
      AGENT_PUBLIC_URL: http://127.0.0.1:8022
    ports: [127.0.0.1:8022:8000]
  warehouse-mcp:
    <<: *common
    command: [python, -m, warehouse_agents.gateway]
    environment:
      <<: *env
      OTEL_SERVICE_NAME: coinsight-agent-gateway
    ports: [127.0.0.1:8020:8000]

networks:
  default: {}
  observability:
    external: true
    name: ${COINSIGHT_OBSERVABILITY_NETWORK:-coinsight_crypto-network}
