# Standalone optional stack: docker compose -p coinsight-agents -f compose.agents.yml up --build -d
services:
  anomaly-agent:
    # Implementation retained for offline experiments; omitted from the default production stack.
    profiles: [experimental-anomaly]
    image: coinsight-local-agents:0.1.0
    build:
      context: .
      dockerfile: agents/Dockerfile
      args:
        BASE_IMAGE: ${AGENT_BASE_IMAGE:-python:3.12-slim}
    environment:
      AGENT_ROLE: anomaly
      AGENT_PUBLIC_URL: http://127.0.0.1:8012
    ports:
      - "127.0.0.1:8012:8000"
    cpus: 1
    mem_limit: 384m
    read_only: true
    tmpfs:
      - /tmp:size=32m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  # Records every served forecast hourly and scores it after the hour closes (ml.prediction_ledger).
  ledger:
    image: coinsight-local-agents:0.1.0
    build:
      context: .
      dockerfile: agents/Dockerfile
      args:
        BASE_IMAGE: ${AGENT_BASE_IMAGE:-python:3.12-slim}
    command: ["python", "-m", "agents.ledger"]
    environment:
      PREDICTION_AGENT_URL: http://prediction-agent:8000
      LEDGER_DATABASE_URL: ${LEDGER_DATABASE_URL:-postgresql://crypto:crypto@host.docker.internal:5432/crypto_dw}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: 0.5
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp:size=16m
    restart: unless-stopped
    depends_on:
      prediction-agent:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  prediction-agent:
    image: coinsight-local-agents:0.1.0
    # The raw Binance cache is a host bind mount. Run with the host developer's
    # UID/GID so atomic `.part` downloads can be created and renamed there.
    # Override these in the root .env when the checkout is owned by another ID.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: .
      dockerfile: agents/Dockerfile
      args:
        BASE_IMAGE: ${AGENT_BASE_IMAGE:-python:3.12-slim}
    environment:
      AGENT_ROLE: prediction
      AGENT_PUBLIC_URL: http://127.0.0.1:8011
      # ANOMALY_AGENT_URL: http://anomaly-agent:8000  # production-disabled
      HOURLY_ENSEMBLE_BUNDLE: /models/ensemble
      DAILY_FORECAST_BUNDLE_ROOT: /models/daily-forecast
      FORECAST_SNAPSHOT_ROOT: /data/forecasting/snapshots
      INTERNAL_SERVICE_TOKEN: ${WAREHOUSE_AGENT_TOKEN:-}
      # Direct service DNS on CoinSight's shared network; do not route through
      # the host's 127.0.0.1-only published PostgreSQL port.
      DATABASE_URL: ${AGENT_DATABASE_URL:-postgresql://crypto:crypto@postgres:5432/crypto_dw}
      RAW_DIR: /data/raw
      BINANCE_DATA_URL: ${BINANCE_DATA_URL:-https://data.binance.vision}
    volumes:
      - ${HOURLY_ENSEMBLE_DIR:-./data/models/agent-serving-bundle/v1}:/models/ensemble:ro
      - ${DAILY_FORECAST_BUNDLE_DIR:-./data/models/daily-forecast}:/models/daily-forecast:ro
      - ./data/forecasting/snapshots:/data/forecasting/snapshots:ro
      - ./data/raw:/data/raw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8011:8000"
    networks:
      - default
      - coinsight-core
    cpus: 2
    mem_limit: 2g
    read_only: true
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  mcp-gateway:
    image: coinsight-local-agents:0.1.0
    build:
      context: .
      dockerfile: agents/Dockerfile
      args:
        BASE_IMAGE: ${AGENT_BASE_IMAGE:-python:3.12-slim}
    command: python -m agents.gateway
    environment:
      PREDICTION_AGENT_URL: http://prediction-agent:8000
      # ANOMALY_AGENT_URL: http://anomaly-agent:8000  # production-disabled
    ports:
      - "127.0.0.1:8010:8000"
    cpus: 1
    mem_limit: 384m
    read_only: true
    tmpfs:
      - /tmp:size=32m
    depends_on:
      prediction-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

networks:
  coinsight-core:
    external: true
    name: coinsight_crypto-network
