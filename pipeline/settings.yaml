# Product and pipeline choices. Connection strings, credentials, paths and
# runtime endpoints belong in .env (see .env.example).
batch:
  symbols: [BTC, ETH, BNB, SOL, XRP, ADA, DOGE, TRX, AVAX, LINK, DOT, LTC, BCH, UNI, ATOM, XLM, ETC, FIL, NEAR, SHIB]
  intervals: [1d, 1h]
  start_month: "2016-01"
  workers: 8
  reject_threshold: 0.05
  archive_timeout_seconds: 30
  archive_attempts: 3
  mart_views: [mart.mv_asset_period_summary, mart.mv_category_performance, mart.mv_hourly_activity]
  daily_schedule_utc: "0 6 * * *"
  daily_retries: 6
  daily_retry_minutes: 60
live:
  symbols: [BTC, ETH, BNB, SOL, XRP, ADA, DOGE, TRX, AVAX, LINK, DOT, LTC, BCH, UNI, ATOM, XLM, ETC, FIL, NEAR, SHIB]
  interval: 1m
  reconnect_seconds: 20
  request_timeout_seconds: 10
  backfill_page_limit: 20
  backfill_page_size: 1000
stream:
  shuffle_partitions: 2
  watermark: "1 day"
  metric_window: "7 days"
  metric_slide: "1 day"
hourly_forecast:
  symbol: BTC
  snapshot_start: "2020-01-01"
  validation_start: "2025-01-01"
  test_start: "2026-01-01"
  relative_mae_target: 0.95
  primary_baseline: zero_return
  feature_version: hourly-return-v1
  model:
    objective: reg:squarederror
    eval_metric: mae
    tree_method: hist
    n_estimators: 500
    learning_rate: 0.03
    max_depth: 3
    min_child_weight: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0
    reg_lambda: 10
    base_score: 0
    random_state: 42
    n_jobs: 2
    early_stopping_rounds: 30
dss:
  symbols: [BTC, ETH, SOL]
  daily_schedule_utc: "30 7 * * *"
  retries: 2
  retry_minutes: 30
  minimum_history_days: 180
  validation_days: 30
  test_days: 30
forecasting:
  symbols: [BTC, ETH] # SOL
  # Predict the next UTC daily close using the target and aligned context
  # candles available through the latest fully closed UTC day.
  context_symbols: ["BTC", "ETH", "BNB", "ADA", "DOGE", "TRX", "LINK", "LTC", "BCH", "ATOM", "ETC"] #UNI, SHIB]
  source_code: binance
  frequency: 1d
  feature_version: daily-return-v2
  lookback_periods: 90
  horizon_periods: 1
  validation_start: "2025-01-01T00:00:00Z"
  test_start: "2026-01-01T00:00:00Z"
  seeds: [42, 123, 2026]
  rolling_baseline_periods: 30
  minimum_month_samples: 20
  history_start:
    BTC: "2016-01-01T00:00:00Z"
    ETH: "2016-01-01T00:00:00Z"
    SOL: "2016-08-11T00:00:00Z"
