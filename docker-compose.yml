services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_dw}
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crypto-network

  migrate:
    image: postgres:16
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-crypto}
      PGDATABASE: ${POSTGRES_DB:-crypto_dw}
      PGPASSWORD: ${POSTGRES_PASSWORD:-crypto}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgres/migrations:/migrations:ro
    command: sh -ec 'for migration in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$$migration"; done'
    networks:
      - crypto-network

  pipeline:
    profiles:
      - batch
    build: ./pipeline
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://crypto:crypto@postgres:5432/crypto_dw}
      SAMPLE_CSV: ${SAMPLE_CSV:-/data/sample.csv}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data:/data:ro
    command: python -m pipeline.batch.warehouse_loader
    networks:
      - crypto-network

  kafka:
    image: apache/kafka:3.9.2
    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - crypto-network

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - crypto-network

  producer:
    profiles:
      - replay
    build: ./pipeline
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${REPLAY_KAFKA_TOPIC:-crypto-prices-replay}
      REPLAY_CSV: ${REPLAY_CSV:-/data/raw/Crypto_historical_data.csv}
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./data:/data:ro
    command: python -m pipeline.stream.kaggle_replay_producer
    networks:
      - crypto-network

  live-producer:
    build: ./pipeline
    restart: unless-stopped
    environment:
      OTEL_SERVICE_NAME: coinsight-producer
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${LIVE_KAFKA_TOPIC:-crypto-prices-live}
      BINANCE_API_URL: ${BINANCE_API_URL:-https://data-api.binance.vision}
      BINANCE_WS_URL: ${BINANCE_WS_URL:-wss://stream.binance.com:9443}
      LIVE_STATE_FILE: ${LIVE_STATE_FILE:-/state/live-producer.json}
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - live-producer-state:/state
    command: python -m pipeline.stream.binance_live_client
    networks:
      - crypto-network

  spark:
    build:
      context: ./pipeline
      dockerfile: Dockerfile.spark
    restart: unless-stopped
    user: root
    environment:
      OTEL_SERVICE_NAME: coinsight-spark
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${STREAM_KAFKA_TOPIC:-crypto-prices-live}
      STREAM_MODE: ${STREAM_MODE:-live}
      DATABASE_URL: ${DATABASE_URL:-postgresql://crypto:crypto@postgres:5432/crypto_dw}
      STREAM_CHECKPOINT: ${STREAM_CHECKPOINT_PATH:-/checkpoints/live-metrics-v2}
      PYTHONPATH: /opt/streaming
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./pipeline:/opt/streaming/pipeline:ro
      - spark-checkpoints:/checkpoints
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9
      - /opt/streaming/pipeline/stream/spark_stream_processor.py
    networks:
      - crypto-network

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - crypto-network

  api:
    build: ./app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://crypto:crypto@postgres:5432/crypto_dw}
      OTEL_SERVICE_NAME: coinsight-api
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
    depends_on:
      jaeger:
        condition: service_started
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    networks:
      - crypto-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:80"
    networks:
      - crypto-network

  airflow:
    profiles:
      - airflow
    build: ./airflow
    # Runs as the host user so it can write the shared data/raw cache.
    user: "${AIRFLOW_UID:-1000}:0"
    environment:
      OTEL_SERVICE_NAME: coinsight-airflow
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-crypto}:${POSTGRES_PASSWORD:-crypto}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # Local development only: every visitor of the UI is an admin.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      PYTHONPATH: /opt/airflow
      DATABASE_URL: ${DATABASE_URL:-postgresql://crypto:crypto@postgres:5432/crypto_dw}
      RAW_DIR: /opt/airflow/data/raw
      BINANCE_DATA_URL: ${BINANCE_DATA_URL:-https://data.binance.vision}
      DSS_MODEL_PATH: /opt/airflow/models/direction.joblib
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./pipeline:/opt/airflow/pipeline:ro
      - ./data/raw:/opt/airflow/data/raw
      - ./data/models:/opt/airflow/models
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8081:8080"
    command: bash -c "python /opt/airflow/create_metadata_db.py && airflow standalone"
    networks:
      - crypto-network

volumes:
  postgres-data:
  kafka-data:
  spark-checkpoints:
  live-producer-state:
  airflow-logs:

networks:
  crypto-network:
    driver: bridge
