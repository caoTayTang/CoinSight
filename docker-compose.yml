services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_dw}
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crypto-network

  pipeline:
    build: ./pipeline
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://crypto:crypto@postgres:5432/crypto_dw}
      SAMPLE_CSV: ${SAMPLE_CSV:-/data/sample.csv}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data:ro
    command: python batch_etl.py
    networks:
      - crypto-network

  kafka:
    image: apache/kafka:3.9.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - crypto-network

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - crypto-network

  producer:
    build: ./pipeline
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-crypto-prices}
      REPLAY_CSV: ${REPLAY_CSV:-/data/raw/Crypto_historical_data.csv}
      REPLAY_SYMBOLS: ${REPLAY_SYMBOLS-BTC,ETH,SOL}
      REPLAY_INTERVAL_SECONDS: ${REPLAY_INTERVAL_SECONDS:-0.01}
      REPLAY_LIMIT: ${REPLAY_LIMIT:-0}
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./data:/data:ro
    command: python producer.py
    networks:
      - crypto-network

  live-producer:
    profiles:
      - live
    build: ./pipeline
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-crypto-prices}
      BINANCE_API_URL: ${BINANCE_API_URL:-https://data-api.binance.vision}
      LIVE_SYMBOLS: ${LIVE_SYMBOLS:-BTC,ETH,SOL}
      LIVE_POLL_SECONDS: ${LIVE_POLL_SECONDS:-20}
      LIVE_REQUEST_TIMEOUT: ${LIVE_REQUEST_TIMEOUT:-10}
    depends_on:
      kafka:
        condition: service_healthy
    command: python live_producer.py
    networks:
      - crypto-network

  spark:
    build:
      context: ./pipeline
      dockerfile: Dockerfile.spark
    user: root
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-crypto-prices}
      DATABASE_URL: ${DATABASE_URL:-postgresql://crypto:crypto@postgres:5432/crypto_dw}
      STREAM_CHECKPOINT: ${STREAM_CHECKPOINT:-/checkpoints/live-metrics}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./pipeline/stream_etl.py:/opt/streaming/stream_etl.py:ro
      - spark-checkpoints:/checkpoints
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9
      - /opt/streaming/stream_etl.py
    networks:
      - crypto-network

  api:
    build: ./app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://crypto:crypto@postgres:5432/crypto_dw}
    depends_on:
      postgres:
        condition: service_healthy
      pipeline:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    networks:
      - crypto-network

volumes:
  postgres-data:
  spark-checkpoints:

networks:
  crypto-network:
    driver: bridge
