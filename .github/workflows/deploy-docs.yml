name: Deploy docs site
on:
  push:
    branches: [main]
    paths: ['docs/**', 'README.md', 'frontend/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build:docs
      # Scoped API token: Account › Workers Scripts: Edit, Zone › Workers Routes: Edit. Not exposed to forks.
      - run: npx --yes wrangler@4.151.3 deploy
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
