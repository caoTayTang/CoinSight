name: CoinSight CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  # Use uv's own Python: the runner's system Python carries Ubuntu's pyOpenSSL in dist-packages, which breaks
  # against the current cryptography (pulled in by PyJWT[crypto]).
  UV_PYTHON_PREFERENCE: only-managed
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crypto
          POSTGRES_PASSWORD: crypto
          POSTGRES_DB: crypto_dw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crypto -d crypto_dw"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://crypto:crypto@localhost:5432/crypto_dw
      APP_ADMIN_TEST_DSN: postgresql://crypto:crypto@localhost:5432/admin_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The admin console's SQL runs against the real schema in its own database (tests/app/test_admin.py).
      - run: |
          psql postgresql://crypto:crypto@localhost:5432/crypto_dw -c 'create database admin_test'
          for f in postgres/init/*.sql postgres/migrations/*.sql; do psql -q -v ON_ERROR_STOP=1 "$APP_ADMIN_TEST_DSN" -f "$f"; done
      - run: uv run --python 3.12 --with pytest --with httpx --with-requirements pipeline/requirements.txt --with-requirements app/requirements.txt --with-requirements scripts/requirements-hourly.txt python -m pytest -q --ignore=tests/agents --ignore=tests/warehouse_agents --ignore=tests/evals
      - run: docker compose config --quiet
      - run: git diff --check
  warehouse-agents-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python 3.12 --with pytest --with pytest-asyncio --with-requirements warehouse_agents/requirements.txt python -m pytest tests/warehouse_agents tests/evals -q
      # Deterministic eval regression: recorded LLM responses, no provider keys or network.
      - run: uv run --python 3.12 --with-requirements warehouse_agents/requirements.txt python -m evals.run --backend replay --routes groq-gpt-oss-120b --split ci --out /tmp/eval-ci --min-pass-rate 0.75
  agents-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python 3.12 --with pytest --with pytest-asyncio --with-requirements agents/requirements.txt python -m pytest tests/agents -q
      - run: docker compose -p coinsight-agents -f compose.agents.yml config --quiet
  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile batch --profile airflow build
      - run: docker compose up -d frontend
      - run: curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:3000/ -o /tmp/coinsight-frontend.html && grep -q 'CoinSight — Asset Intelligence' /tmp/coinsight-frontend.html
      - run: curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:3000/api/health | grep -q '"status":"ok"'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: node frontend/scripts/check-websocket.mjs
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, images]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: ./app
            dockerfile: ./app/Dockerfile
          - name: frontend
            context: .
            dockerfile: ./frontend/Dockerfile
          - name: pipeline
            context: ./pipeline
            dockerfile: ./pipeline/Dockerfile
          - name: spark
            context: ./pipeline
            dockerfile: ./pipeline/Dockerfile.spark
          - name: airflow
            context: ./airflow
            dockerfile: ./airflow/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/coinsight-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/coinsight-${{ matrix.name }}:${{ github.sha }}
