name: CoinSight CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crypto
          POSTGRES_PASSWORD: crypto
          POSTGRES_DB: crypto_dw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crypto -d crypto_dw"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://crypto:crypto@localhost:5432/crypto_dw
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python 3.12 --with pytest --with httpx --with-requirements pipeline/requirements.txt --with-requirements app/requirements.txt python -m pytest -q
      - run: docker compose config --quiet
      - run: git diff --check
  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile batch --profile replay --profile airflow build
      - run: docker compose up -d frontend
      - run: curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:3000/ -o /tmp/coinsight-frontend.html && grep -q 'CoinSight — Asset Intelligence' /tmp/coinsight-frontend.html
      - run: curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://localhost:3000/api/health | grep -q '"status":"ok"'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix frontend test
      - run: node frontend/scripts/check-websocket.mjs
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, images]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: ./app
            dockerfile: ./app/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: pipeline
            context: ./pipeline
            dockerfile: ./pipeline/Dockerfile
          - name: spark
            context: ./pipeline
            dockerfile: ./pipeline/Dockerfile.spark
          - name: airflow
            context: ./airflow
            dockerfile: ./airflow/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/coinsight-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/coinsight-${{ matrix.name }}:${{ github.sha }}
